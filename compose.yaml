services:
  postgres:
    image: postgres:17
    container_name: perfumehub-postgres
    environment:
      POSTGRES_DB: perfumehub
      POSTGRES_USER: perfumehub
      POSTGRES_PASSWORD: perfumehub
    ports:
      - "5432:5432"
    volumes:
      - perfumehub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumehub -d perfumehub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  perfumehub-postgres-data: